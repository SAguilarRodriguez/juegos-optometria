name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'juegos/pupi-man-bacterias/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar el juego dentro de la app (con la fuente, para jugar sin internet)
        run: |
          mkdir -p android/app/src/main/assets
          cp android/fonts/PressStart2P-latin.woff2 android/app/src/main/assets/
          sed 's#</title>#</title><style>@font-face{font-family:"Press Start 2P";src:url(PressStart2P-latin.woff2) format("woff2")}</style>#' \
            juegos/pupi-man-bacterias/index.html > android/app/src/main/assets/index.html

      - name: Compilar APK
        run: gradle -p android assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PupiMan-INOP.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pupi-Man INOP para Android (versión ${{ github.run_number }})
          body: Descarga PupiMan-INOP.apk en el celular y ábrelo para instalarlo.
          files: PupiMan-INOP.apk
          make_latest: true
